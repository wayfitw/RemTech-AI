services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remtech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remtech}
      POSTGRES_DB: ${POSTGRES_DB:-remtech}
    ports:
      # Только на localhost хоста — не выставляем БД в ЛВС (issue #5).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remtech} -d ${POSTGRES_DB:-remtech}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Redis под паролем (issue #5). В production задай сильный REDIS_PASSWORD.
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning",
              "--requirepass", "${REDIS_PASSWORD:-remtech-redis}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-remtech-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # production включает гейт обязательных секретов (JWT_SECRET/DATABASE_URL/CORS_ORIGINS).
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-remtech}:${POSTGRES_PASSWORD:-remtech}@postgres:5432/${POSTGRES_DB:-remtech}
      REDIS_URL: redis://:${REDIS_PASSWORD:-remtech-redis}@redis:6379/0
      OLLAMA_URL: http://ollama:11434
      TEI_URL: ${TEI_URL:-}          # #39 — реранкер; пусто → одностадийный поиск (без GPU)
      KB_ASYNC_INGEST: "true"        # ингест БЗ — через Celery-воркер (issue #22)
      ORCHESTRATOR_STATE_BACKEND: redis   # общее состояние диалога (issue #16)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - filesdata:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Celery-воркер: фоновый конвейер ингеста базы знаний (issue #22)
  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.celery_app", "worker", "-B", "--loglevel=info", "--concurrency=2"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-remtech}:${POSTGRES_PASSWORD:-remtech}@postgres:5432/${POSTGRES_DB:-remtech}
      REDIS_URL: redis://:${REDIS_PASSWORD:-remtech-redis}@redis:6379/0
      OLLAMA_URL: http://ollama:11434
      TEI_URL: ${TEI_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - filesdata:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Telegram-бот (DevOps-регламент, раздел 7): long polling, ОДИН процесс на один
  # токен. Стартует только с профилем telegram — осознанно, когда в .env заданы
  # TELEGRAM_BOT_TOKEN и TELEGRAM_ALLOWLIST (без токена процесс сразу падает):
  #   docker compose --profile telegram up -d telegram
  # Для stage завести ОТДЕЛЬНОГО бота в @BotFather (не путать с прод-токеном).
  telegram:
    build:
      context: ./backend
    command: ["python", "-m", "app.telegram_bot"]
    profiles: ["telegram"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-remtech}:${POSTGRES_PASSWORD:-remtech}@postgres:5432/${POSTGRES_DB:-remtech}
      REDIS_URL: redis://:${REDIS_PASSWORD:-remtech-redis}@redis:6379/0
      OLLAMA_URL: http://ollama:11434
      TEI_URL: ${TEI_URL:-}
      ORCHESTRATOR_STATE_BACKEND: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - filesdata:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # #39 — TEI-реранкер (bge-reranker-v2-m3) на GPU. Стартует только с профилем gpu:
  #   docker compose --profile gpu up -d tei
  # затем задать окружение api/worker: TEI_URL=http://tei:80 (двухстадийный поиск БЗ).
  # Пустой TEI_URL (по умолчанию) — одностадийный косинусный поиск, GPU не нужен.
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    profiles: ["gpu"]
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    volumes:
      - teidata:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Локальный эмбеддер bge-m3 (issue #22 — раньше эмбеддер был недостижим в compose).
  # После первого старта выполнить: docker compose exec ollama ollama pull bge-m3
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddydata:/data
      - caddyconfig:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # для биндинга портов 80/443
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  filesdata:
  ollamadata:
  teidata:
  caddydata:
  caddyconfig:
